# local mongodb for development; atlas is only used once deployed
services:
  mongo:
    image: mongo:8
    # transactions need a replica set, so run a single node one
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # initiate the replica set on first start; later runs just report ok
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
