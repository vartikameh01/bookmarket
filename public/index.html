<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarket · buy and sell new and used books</title>
  <meta name="description" content="Buy and sell new and used books. Compare offers from different sellers on every title.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/pages/home.js"></script>
</head>
<body>
  <main id="main" class="page page-width" tabindex="-1">
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <span class="hero__kicker">New &amp; used books</span>
        <h1 id="hero-title">Every book deserves a <em>second reader.</em></h1>
        <p>Compare offers from readers and sellers on the same title, pick the copy that suits you, and pass on the ones you've finished.</p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="/catalog.html">Browse books</a>
          <a class="btn" href="/sell.html">Sell a book</a>
        </div>
      </div>
      <div class="shelf-art" aria-hidden="true">
        <span style="--i:0; --h:72%; --c:#2e5b4b"></span>
        <span style="--i:1; --h:88%; --c:#a3341f; --w:2rem"></span>
        <span style="--i:2; --h:64%; --c:#b9851a; --w:1.3rem"></span>
        <span style="--i:3; --h:94%; --c:#1d1a16"></span>
        <span style="--i:4; --h:78%; --c:#2d6a73; --w:2.2rem"></span>
        <span style="--i:5; --h:58%; --c:#9a5a3c; --w:1.2rem"></span>
        <span style="--i:6; --h:84%; --c:#7f2414"></span>
        <span style="--i:7; --h:70%; --c:#5a5247; --w:1.9rem"></span>
        <span class="is-leaning" style="--i:8; --h:76%; --c:#2e5b4b; --w:1.4rem"></span>
      </div>
    </section>

    <section class="home-section" aria-labelledby="genres-title">
      <div class="home-section__head">
        <h2 id="genres-title">Browse by genre</h2>
      </div>
      <nav class="chips" id="genre-chips" aria-labelledby="genres-title"></nav>
    </section>

    <section class="home-section" aria-labelledby="recent-title">
      <div class="home-section__head">
        <h2 id="recent-title">Recently listed</h2>
        <a href="/catalog.html">See all →</a>
      </div>
      <div class="shelf" id="recent"><div class="spinner" role="status" aria-label="Loading books"></div></div>
    </section>

    <section class="home-section" aria-labelledby="cheap-title">
      <div class="home-section__head">
        <h2 id="cheap-title">Cheapest used copies</h2>
        <a href="/catalog.html?condition=used&amp;sort=price_asc">See all →</a>
      </div>
      <div class="shelf" id="cheap"><div class="spinner" role="status" aria-label="Loading books"></div></div>
    </section>
  </main>
</body>
</html>
